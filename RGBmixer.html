<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RGB Color Mixer</title>
<style>
:root{--bg:#f3f3f1;--fg:#1c1c1c;--muted:#6b6b6b;--panel:#fff;--line:#d9d9d5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161616;--fg:#f0f0ee;--muted:#9a9a96;--panel:#222;--line:#3a3a3a}}
:root[data-theme="dark"]{--bg:#161616;--fg:#f0f0ee;--muted:#9a9a96;--panel:#222;--line:#3a3a3a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:560px}
h1{font-size:1.4rem;margin:0 0 16px;font-weight:650}
#preview{height:180px;border-radius:14px;border:1px solid var(--line);background:#808080;margin-bottom:24px}
.row{margin-bottom:22px}
.row label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.row label span{font-family:ui-monospace,Menlo,Consolas,monospace}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:44px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:var(--track)}
input[type=range]::-moz-range-track{height:16px;border-radius:8px;background:var(--track)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:36px;height:36px;border-radius:50%;background:#fff;border:4px solid var(--c);margin-top:-10px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:4px solid var(--c)}
input[type=range]:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
#r{--c:#e53935;--track:linear-gradient(90deg,#000,#f00)}
#g{--c:#43a047;--track:linear-gradient(90deg,#000,#0f0)}
#b{--c:#1e88e5;--track:linear-gradient(90deg,#000,#00f)}
.out{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.line:last-child{border-bottom:0}
.line b{color:var(--muted);font-weight:500;flex:none}
.line code{font-family:ui-monospace,Menlo,Consolas,monospace;text-align:right;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
<h1>RGB Color Mixer</h1>
<div id="preview"></div>

<div class="row"><label for="r">Rot <span id="rh">80</span></label><input type="range" id="r" min="0" max="255" value="128"></div>
<div class="row"><label for="g">Grün <span id="gh">80</span></label><input type="range" id="g" min="0" max="255" value="128"></div>
<div class="row"><label for="b">Blau <span id="bh">80</span></label><input type="range" id="b" min="0" max="255" value="128"></div>

<div class="out">
<div class="line"><b>RGB (0–255)</b><code id="dec"></code></div>
<div class="line"><b>Hex</b><code id="hex"></code></div>
<div class="line"><b>Binär</b><code id="bin"></code></div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
const h2=n=>n.toString(16).padStart(2,"0");
const b8=n=>n.toString(2).padStart(8,"0");
function update(){
  const v=["r","g","b"].map(k=>+$(k).value);
  v.forEach((n,i)=>$("rgb"[i]+"h").textContent=h2(n));
  $("preview").style.background=`rgb(${v})`;
  $("dec").textContent=`${v[0]}, ${v[1]}, ${v[2]}`;
  $("hex").textContent="#"+v.map(h2).join("");
  $("bin").textContent=v.map(b8).join(" ");
}
["r","g","b"].forEach(k=>$(k).addEventListener("input",update));
update();
</script>
</body>
</html>
